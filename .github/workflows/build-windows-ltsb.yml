# Experimental build for Windows 10 Enterprise 2016 LTSB (10.0.14393 / 1607).
#
# Deliberately isolated from build.yml: it only runs for tags starting with
# `ltsb-` (or a manual dispatch), so the regular `v*` release pipeline and its
# branches are untouched.
#
# The build itself is the regular Windows release, with the default CPython
# runtime; the only behavioural difference on 1607 is that the integrated
# terminal is disabled (ConPTY requires 10.0.17763). Plugins, the Python host
# and every other feature stay on the same code path as other platforms.
name: Build Windows 10 1607 (experiment)

on:
  push:
    tags:
      - "ltsb-*"
  workflow_dispatch:

concurrency:
  group: win10-1607-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 1607
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # flutter_pty is pinned to a commit on its own experiment branch;
          # a shallow checkout would not contain that revision.
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.4"
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        run: flutter pub get

      - name: Package Python app
        run: dart run serious_python:main package "assets/python_runtime_boot" --platform Windows --asset "assets/python_runtime_boot.zip" --verbose

      - name: Build Windows release
        run: flutter build windows --release --verbose

      # The release folder does not ship the MSVC runtime, and a clean 1607 VM
      # will not run the app without it. App-local copies are enough here.
      - name: Bundle the MSVC runtime
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            Copy-Item -Path (Join-Path $env:SystemRoot "System32\$dll") -Destination $release -Force
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$release\*" -DestinationPath "pyride-win10-1607.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyride-win10-1607
          path: pyride-win10-1607.zip
          if-no-files-found: error
          retention-days: 14
